<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahlun | Terminal Site</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="terminal">
        <div id="output"></div>
        <div id="input-line">
            <span id="prompt">
                <span class="user-host">ahlun@localhost</span>:<span class="dir">~</span>$
            </span>
            <input type="text" id="command-input" autocomplete="off" spellcheck="false" autofocus>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
